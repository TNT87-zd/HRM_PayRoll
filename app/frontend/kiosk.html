<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosk chấm công - Cafe Biển Xanh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes scan { 0% {top: 0} 50% {top: 100%} 100% {top: 0} }
    .laser { position: absolute; left: 0; right: 0; height: 3px; background: #38bdf8;
             box-shadow: 0 0 14px #38bdf8; animation: scan 2.5s linear infinite; pointer-events: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold">Cafe Biển Xanh · Chấm công khuôn mặt</h1>
      <div class="flex items-center gap-2 mt-0.5">
        <span id="device" class="text-slate-400"></span>
        <span class="text-slate-600">·</span>
        <a href="/enroll.html" class="text-xs text-indigo-400 hover:underline">Đăng ký FaceID</a>
        <span class="text-slate-600">·</span>
        <a href="/admin.html" class="text-xs text-slate-400 hover:underline">Admin</a>
      </div>
    </div>
    <div class="text-right">
      <p id="clock" class="text-4xl font-bold tabular-nums">--:--:--</p>
      <p id="today" class="text-slate-400"></p>
    </div>
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <!-- Camera Section -->
    <div class="lg:col-span-2 bg-slate-800 rounded-xl p-3">
      <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden">
        <video id="cam" autoplay muted playsinline class="absolute inset-0 w-full h-full object-contain"></video>
        <canvas id="overlay" class="absolute inset-0 w-full h-full"></canvas>
        <div class="laser"></div>
      </div>
    </div>

    <!-- Panel Section -->
    <div class="flex flex-col gap-4">
      
      <!-- NÚT CHỌN CHẾ ĐỘ VÀO / RA -->
      <div class="flex gap-3">
        <button id="btn-in" onclick="setMode('IN')" class="flex-1 bg-green-500 text-slate-900 text-lg font-bold py-3 rounded-xl border-b-4 border-green-700 transition-all">👋 VÀO (IN)</button>
        <button id="btn-out" onclick="setMode('OUT')" class="flex-1 bg-slate-800 text-slate-400 text-lg font-bold py-3 rounded-xl border-b-4 border-slate-900 transition-all hover:bg-slate-700">🏃 RA (OUT)</button>
      </div>

      <!-- Thẻ thông báo kết quả -->
      <div id="card" class="bg-slate-800 rounded-xl p-5 border-4 border-slate-600">
        <p id="title" class="text-3xl font-bold">Đang chờ quét…</p>
        <p id="sub" class="text-slate-300 mt-1">Nhìn thẳng vào camera</p>
        <p id="time" class="text-slate-400 mt-1"></p>
        
        <p class="text-sm text-slate-400 mt-4 mb-1">Độ giống khuôn mặt <span id="simTxt" class="font-bold text-slate-100"></span></p>
        <div class="relative h-4 bg-slate-700 rounded-full overflow-hidden">
          <div id="simBar" class="h-full rounded-full" style="width:0%"></div>
          <div class="absolute top-0 bottom-0 w-0.5 bg-white" style="left:55%"></div>
        </div>
        <p class="text-xs text-slate-500 mt-1">Vạch trắng = ngưỡng chấp nhận 55%</p>
      </div>

      <!-- Lịch sử quét -->
      <div class="bg-slate-800 rounded-xl p-5">
        <div class="flex justify-between items-center mb-2">
          <h2 class="font-bold">5 lượt quét gần nhất</h2>
          <button id="btnSound" class="text-sm bg-slate-700 hover:bg-slate-600 rounded px-3 py-1">Âm thanh: Tắt</button>
        </div>
        <ul id="history" class="space-y-2 text-sm"></ul>
      </div>
    </div>
  </div>

<script>
// ===== Cấu hình =====
const API = '/api/kiosk/recognize';
const DEVICE_ID = 'CN01-TB01';
const LAT = 16.0471, LON = 108.2208;
const SCAN_MS = 1500;
const COOLDOWN_MS = 5000;
const REASONS = {
  below_threshold: 'Không khớp nhân viên nào (người lạ)',
  ambiguous_margin: 'Khó phân biệt, hãy thử lại',
  empty_gallery: 'Chưa có dữ liệu khuôn mặt',
  spoof: 'Nghi giả mạo (ảnh/video)'
};
const DEMO = new URLSearchParams(location.search).has('demo');

// ===== Biến chung =====
const $ = id => document.getElementById(id);
const video = $('cam'), cv = $('overlay'), ctx = cv.getContext('2d');
let fw = 640, fh = 360, busy = false, pauseUntil = 0, resetTimer = null, sound = false;
let scanMode = 'IN'; // Mặc định là chấm VÀO

// ===== Đồng hồ =====
function tick() {
  const n = new Date();
  $('clock').textContent = n.toLocaleTimeString('vi-VN');
  $('today').textContent = n.toLocaleDateString('vi-VN', {weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'});
}
setInterval(tick, 1000); tick();
$('device').textContent = 'Thiết bị ' + DEVICE_ID;

// ===== Chuyển đổi trạng thái IN / OUT =====
function setMode(mode) {
  scanMode = mode;
  const isIN = mode === 'IN';
  $('btn-in').className = isIN
    ? 'flex-1 bg-green-500 text-slate-900 text-lg font-bold py-3 rounded-xl border-b-4 border-green-700 transition-all'
    : 'flex-1 bg-slate-800 text-slate-400 text-lg font-bold py-3 rounded-xl border-b-4 border-slate-900 transition-all hover:bg-slate-700';

  $('btn-out').className = !isIN
    ? 'flex-1 bg-orange-500 text-slate-900 text-lg font-bold py-3 rounded-xl border-b-4 border-orange-700 transition-all'
    : 'flex-1 bg-slate-800 text-slate-400 text-lg font-bold py-3 rounded-xl border-b-4 border-slate-900 transition-all hover:bg-slate-700';
  
  setIdle();
}

// ===== Âm thanh =====
function speak(t) {
  if (!sound) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'vi-VN'; speechSynthesis.speak(u); } catch (e) {}
}
$('btnSound').onclick = () => { sound = !sound; $('btnSound').textContent = 'Âm thanh: ' + (sound ? 'Bật' : 'Tắt'); };

// ===== Camera =====
navigator.mediaDevices.getUserMedia({video: {width: 1280, height: 720}, audio: false})
  .then(s => { video.srcObject = s; })
  .catch(() => setMsg('Không mở được camera', 'Hãy cho phép trình duyệt truy cập camera', '#ef4444'));

function grab() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return Promise.resolve(null);
  fw = 640; fh = Math.round(640 * vh / vw);
  const c = document.createElement('canvas'); c.width = fw; c.height = fh;
  c.getContext('2d').drawImage(video, 0, 0, fw, fh);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

// ===== Vẽ khung mặt =====
function clearBox() { ctx.clearRect(0, 0, cv.width, cv.height); }
function drawBox(b, color, label) {
  const cw = cv.clientWidth, ch = cv.clientHeight;
  cv.width = cw; cv.height = ch;
  if (!b) return;
  const s = Math.min(cw / fw, ch / fh), ox = (cw - fw * s) / 2, oy = (ch - fh * s) / 2;
  const x = ox + b[0] * s, y = oy + b[1] * s, w = (b[2] - b[0]) * s, h = (b[3] - b[1]) * s;
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h);
  ctx.font = 'bold 20px sans-serif';
  const tw = ctx.measureText(label).width + 16, ty = Math.max(y - 32, 0);
  ctx.fillStyle = color; ctx.fillRect(x, ty, tw, 32);
  ctx.fillStyle = '#0f172a'; ctx.fillText(label, x + 8, ty + 23);
}

// ===== Thẻ kết quả =====
function setMsg(title, sub, color) {
  $('card').style.borderColor = color;
  $('title').textContent = title; $('title').style.color = color;
  $('sub').textContent = sub;
}
function setIdle() {
  const txt = scanMode === 'IN' ? 'VÀO' : 'RA';
  const col = scanMode === 'IN' ? '#22c55e' : '#f97316';
  setMsg(`Đang chờ quét ${txt}…`, 'Nhìn thẳng vào camera', col);
  $('time').textContent = ''; $('simTxt').textContent = ''; $('simBar').style.width = '0%';
}
function addHistory(label, time, color, ok) {
  const li = document.createElement('li'); li.className = 'flex justify-between';
  const a = document.createElement('span'); a.style.color = color; a.textContent = (ok ? '✓ ' : '✗ ') + label;
  const b = document.createElement('span'); b.className = 'text-slate-400'; b.textContent = time;
  li.append(a, b);
  $('history').prepend(li);
  while ($('history').children.length > 5) $('history').lastChild.remove();
}

// ===== Xử lý kết quả =====
function handle(r) {
  if (r.reason === 'no_face') { clearBox(); setIdle(); return; }
  
  const ok = r.matched;
  const color = ok ? (scanMode === 'IN' ? '#22c55e' : '#f97316') : '#ef4444';
  const sim = r.similarity ?? 0;
  const time = new Date(r.timestamp).toLocaleTimeString('vi-VN');
  
  // Backend sẽ gửi kết quả phân tích Ca làm việc (đúng giờ/đi trễ) vào biến r.reason
  const why = REASONS[r.reason] || r.reason || 'Từ chối';

  drawBox(r.bbox, color, ok ? `${r.full_name} · ${(sim * 100).toFixed(1)}%` : 'Không hợp lệ');
  setMsg(ok ? r.full_name : 'Không chấm công được', ok ? why : why, color);
  
  $('time').textContent = time;
  $('simTxt').textContent = (sim * 100).toFixed(1) + '%';
  $('simBar').style.width = Math.min(sim * 100, 100) + '%';
  $('simBar').style.background = color;
  addHistory(ok ? r.full_name : why, time, color, ok);
  
  if (ok) speak(why);

  const wait = ok ? COOLDOWN_MS : 2500;
  pauseUntil = Date.now() + wait;
  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => { clearBox(); setIdle(); }, wait);
}

// ===== Gửi hình lên Backend =====
async function scan() {
  if (busy || Date.now() < pauseUntil) return;
  busy = true;
  try {
    const blob = await grab();
    if (!blob) return;
    const fd = new FormData();
    fd.append('file', blob, 'frame.jpg');
    fd.append('device_id', DEVICE_ID);
    fd.append('scan_type', scanMode);  // GỬI KÈM TRẠNG THÁI IN/OUT
    fd.append('lat', LAT); fd.append('lon', LON);
    
    const res = await fetch(API, {method: 'POST', body: fd});
    if (!res.ok) throw new Error(res.status);
    handle(await res.json());
  } catch (e) {
    setMsg('Mất kết nối', 'Đang thử lại…', '#eab308');
  } finally { busy = false; }
}

setInterval(scan, SCAN_MS);
setMode('IN'); // Khởi tạo UI
</script>
</body>
</html>
