<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosk chấm công - Cafe 5TN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes scan { 0% {top: 0} 50% {top: 100%} 100% {top: 0} }
    .laser { position: absolute; left: 0; right: 0; height: 3px; background: #38bdf8;
             box-shadow: 0 0 14px #38bdf8; animation: scan 2.5s linear infinite; pointer-events: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
<div style="padding:12px;background:#fff3cd;color:#302900">Đăng nhập tài khoản HR/Kiosk tại <a href="/portal.html">cổng quản lý</a> trước. Cần có lịch ca và GPS. Bản demo chưa kiểm tra liveness.</div>
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold">Cafe 5TN · Chấm công khuôn mặt</h1>
      <p id="device" class="text-slate-400"></p>
    </div>
    <div class="text-right">
      <p id="clock" class="text-4xl font-bold tabular-nums">--:--:--</p>
      <p id="today" class="text-slate-400"></p>
    </div>
  </div>

  <!-- Nút chọn chế độ Check-in / Check-out -->
  <div class="flex gap-4 mb-4">
    <button id="btnIn" onclick="setMode('IN')" class="flex-1 py-3 text-lg font-bold rounded-xl transition bg-green-600 text-white ring-4 ring-green-400">
      Chấm công VÀO (Check-in)
    </button>
    <button id="btnOut" onclick="setMode('OUT')" class="flex-1 py-3 text-lg font-bold rounded-xl transition bg-slate-700 text-slate-300 hover:bg-slate-600">
      Chấm công RA (Check-out)
    </button>
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 bg-slate-800 rounded-xl p-3">
      <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden">
        <video id="cam" autoplay muted playsinline class="absolute inset-0 w-full h-full object-contain"></video>
        <canvas id="overlay" class="absolute inset-0 w-full h-full"></canvas>
        <div class="laser"></div>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <div id="card" class="bg-slate-800 rounded-xl p-5 border-4 border-slate-600">
        <p id="title" class="text-3xl font-bold">Đang chờ quét VÀO…</p>
        <p id="sub" class="text-slate-300 mt-1">Nhìn thẳng vào camera</p>
        <p id="time" class="text-slate-400 mt-1"></p>
        <p class="text-sm text-slate-400 mt-4 mb-1">Độ giống khuôn mặt <span id="simTxt" class="font-bold text-slate-100"></span></p>
        <div class="relative h-4 bg-slate-700 rounded-full overflow-hidden">
          <div id="simBar" class="h-full rounded-full" style="width:0%"></div>
          <div class="absolute top-0 bottom-0 w-0.5 bg-white" style="left:55%"></div>
        </div>
        <p class="text-xs text-slate-500 mt-1">Vạch trắng = ngưỡng chấp nhận 55%</p>
      </div>

      <div class="bg-slate-800 rounded-xl p-5">
        <div class="flex justify-between items-center mb-2">
          <h2 class="font-bold">5 lượt quét gần nhất</h2>
          <button id="btnSound" class="text-sm bg-slate-700 hover:bg-slate-600 rounded px-3 py-1">Âm thanh: Tắt</button>
        </div>
        <ul id="history" class="space-y-2 text-sm"></ul>
      </div>
    </div>
  </div>

<script>
// ===== Cấu hình =====
const API = '/api/kiosk/recognize';
const DEVICE_ID = 'CN01-TB01';
const LAT = 16.0471, LON = 108.2208;
const SCAN_MS = 500;          // quét dày để backend gom đủ 3 khung hình (voting)
const COOLDOWN_MS = 5000;     // nghỉ sau khi chấm công thành công
let scanMode = 'IN';          // Mặc định là Check-in

const $ = id => document.getElementById(id);
const video = $('cam'), cv = $('overlay'), ctx = cv.getContext('2d');
let fw = 640, fh = 360, busy = false, pauseUntil = 0, resetTimer = null, sound = false;

// ===== Thông báo theo mã lý do từ backend =====
const REASONS = {
  accepted: 'Hợp lệ',
  verifying: 'Đang xác thực, giữ nguyên khuôn mặt…',
  duplicate: 'Bạn vừa chấm công rồi',
  below_threshold: 'Không khớp nhân viên nào',
  low_similarity: 'Không khớp nhân viên nào',
  ambiguous_margin: 'Khó phân biệt, hãy thử lại',
  empty_gallery: 'Chưa có dữ liệu khuôn mặt',
  outside_geofence: 'Ngoài vị trí cửa hàng',
  low_quality: 'Ảnh chưa rõ, hãy nhìn thẳng vào camera',
  multiple_faces: 'Chỉ một người trong khung hình',
  engine_unavailable: 'Hệ thống nhận diện chưa sẵn sàng',
  spoof: 'Nghi giả mạo'
};

// Các trạng thái chỉ hiển thị tạm, không ghi vào "5 lượt quét gần nhất"
const NO_HISTORY = new Set(['verifying', 'duplicate', 'low_quality', 'multiple_faces',
                            'engine_unavailable', 'empty_gallery']);

function setMode(mode) {
  scanMode = mode;
  const btnIn = $('btnIn'), btnOut = $('btnOut');
  if (mode === 'IN') {
    btnIn.className = 'flex-1 py-3 text-lg font-bold rounded-xl transition bg-green-600 text-white ring-4 ring-green-400';
    btnOut.className = 'flex-1 py-3 text-lg font-bold rounded-xl transition bg-slate-700 text-slate-300 hover:bg-slate-600';
  } else {
    btnOut.className = 'flex-1 py-3 text-lg font-bold rounded-xl transition bg-amber-600 text-white ring-4 ring-amber-400';
    btnIn.className = 'flex-1 py-3 text-lg font-bold rounded-xl transition bg-slate-700 text-slate-300 hover:bg-slate-600';
  }
  clearTimeout(resetTimer);
  pauseUntil = 0;
  clearBox();
  setIdle();
}

// ===== Đồng hồ =====
function tick() {
  const n = new Date();
  $('clock').textContent = n.toLocaleTimeString('vi-VN');
  $('today').textContent = n.toLocaleDateString('vi-VN', {weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric'});
}
setInterval(tick, 1000); tick();
$('device').textContent = 'Thiết bị ' + DEVICE_ID;

// ===== Âm thanh =====
function speak(t) {
  if (!sound) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'vi-VN'; speechSynthesis.speak(u); } catch (e) {}
}
$('btnSound').onclick = () => {
  sound = !sound;
  $('btnSound').textContent = 'Âm thanh: ' + (sound ? 'Bật' : 'Tắt');
  if (sound) speak('Đã bật âm thanh');
};

// ===== Camera =====
navigator.mediaDevices.getUserMedia({video: {width: 1280, height: 720}, audio: false})
  .then(s => { video.srcObject = s; })
  .catch(() => setMsg('Không mở được camera', 'Hãy cho phép trình duyệt truy cập camera', '#ef4444'));

function grab() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return Promise.resolve(null);
  fw = 640; fh = Math.round(640 * vh / vw);
  const c = document.createElement('canvas'); c.width = fw; c.height = fh;
  c.getContext('2d').drawImage(video, 0, 0, fw, fh);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

// ===== Vẽ Bounding Box =====
function clearBox() { ctx.clearRect(0, 0, cv.width, cv.height); }
function drawBox(b, color, label) {
  const cw = cv.clientWidth, ch = cv.clientHeight;
  cv.width = cw; cv.height = ch;
  if (!b) return;
  const s = Math.min(cw / fw, ch / fh), ox = (cw - fw * s) / 2, oy = (ch - fh * s) / 2;
  const x = ox + b[0] * s, y = oy + b[1] * s, w = (b[2] - b[0]) * s, h = (b[3] - b[1]) * s;
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h);
  ctx.font = 'bold 20px sans-serif';
  const tw = ctx.measureText(label).width + 16, ty = Math.max(y - 32, 0);
  ctx.fillStyle = color; ctx.fillRect(x, ty, tw, 32);
  ctx.fillStyle = '#0f172a'; ctx.fillText(label, x + 8, ty + 23);
}

// ===== Cập nhật UI =====
function setMsg(title, sub, color) {
  $('card').style.borderColor = color;
  $('title').textContent = title; $('title').style.color = color;
  $('sub').textContent = sub;
}
function setIdle() {
  setMsg(scanMode === 'IN' ? 'Đang chờ quét VÀO…' : 'Đang chờ quét RA…', 'Nhìn thẳng vào camera', '#475569');
  $('title').style.color = '';
  $('time').textContent = ''; $('simTxt').textContent = ''; $('simBar').style.width = '0%';
}
function setSim(sim, color) {
  $('simTxt').textContent = (sim * 100).toFixed(1) + '%';
  $('simBar').style.width = Math.min(sim * 100, 100) + '%';
  $('simBar').style.background = color;
}

function addHistory(label, statusMsg, time, color, ok) {
  const li = document.createElement('li');
  li.className = 'flex justify-between items-center text-xs py-1.5 border-b border-slate-700/50';

  const a = document.createElement('div');
  a.className = 'flex flex-col';

  const title = document.createElement('span');
  title.style.color = color;
  title.className = 'font-bold';
  title.textContent = (ok ? '✓ ' : '✗ ') + label;

  const sub = document.createElement('span');
  sub.className = 'text-slate-400 text-[11px] mt-0.5';
  sub.textContent = statusMsg || '';

  a.append(title, sub);

  const b = document.createElement('span');
  b.className = 'text-slate-400 font-mono text-[11px]';
  b.textContent = time;

  li.append(a, b);
  $('history').prepend(li);
  while ($('history').children.length > 5) $('history').lastChild.remove();
}

function holdAndReset(ms) {
  pauseUntil = Date.now() + ms;
  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => { clearBox(); setIdle(); }, ms);
}

// ===== Xử lý kết quả trả về từ Backend =====
function handle(r) {
  const reason = r.reason || '';
  const sim = r.similarity ?? 0;

  if (reason === 'no_face') { clearBox(); setIdle(); return; }

  // Đang gom đủ số khung hình để xác thực: chưa kết luận, KHÔNG khóa cooldown
  if (reason === 'verifying') {
    drawBox(r.bbox, '#eab308', 'Đang xác thực…');
    setMsg('Đang xác thực…', REASONS.verifying, '#eab308');
    setSim(sim, '#eab308');
    return;
  }

  // Chỉ coi là thành công khi backend xác nhận "accepted"
  const ok = reason === 'accepted';
  const isDuplicate = reason === 'duplicate';
  const empName = r.full_name || r.employee_id || 'Nhân viên';
  const color = ok ? '#22c55e' : (isDuplicate ? '#38bdf8' : '#ef4444');
  const time = new Date(r.timestamp || Date.now()).toLocaleTimeString('vi-VN');
  const why = REASONS[reason] || reason || 'Từ chối';
  const statusInfo = r.status_msg || why;

  if (ok) {
    drawBox(r.bbox, color, `${empName} · ${(sim * 100).toFixed(1)}%`);
    setMsg(`${empName} [${scanMode}]`, `Mã NV: ${r.employee_id || ''} · ${statusInfo}`, color);
  } else if (isDuplicate) {
    drawBox(r.bbox, color, empName);
    setMsg(empName, why, color);
  } else {
    drawBox(r.bbox, color, 'Không hợp lệ');
    setMsg('Không chấm công được', why, color);
  }

  $('time').textContent = time;
  setSim(sim, color);

  // Chỉ lưu vào "5 lượt quét gần nhất" các kết quả có ý nghĩa
  if (!NO_HISTORY.has(reason)) {
    addHistory(`${empName} [${scanMode}]`, statusInfo, time, color, ok);
  }

  if (ok) speak(`Xin chào ${empName}, ${statusInfo}`);

  // Thời gian nghỉ trước khi quét tiếp
  let wait = 2500;
  if (ok) wait = COOLDOWN_MS;
  else if (isDuplicate) wait = 3000;
  else if (reason === 'low_quality' || reason === 'multiple_faces') wait = 1500;
  holdAndReset(wait);
}

// ===== Vòng lặp gửi ảnh nhận diện =====
async function scan() {
  if (busy || Date.now() < pauseUntil) return;
  busy = true;
  try {
    const blob = await grab();
    if (!blob) return;
    const fd = new FormData();
    fd.append('file', blob, 'frame.jpg');
    fd.append('device_id', DEVICE_ID);
    fd.append('scan_type', scanMode); // Gửi chế độ IN/OUT
    fd.append('lat', LAT); fd.append('lon', LON);
    const res = await fetch(API, {method: 'POST', body: fd});
    if (!res.ok) { const error = await res.json(); throw new Error(error.detail || ('HTTP ' + res.status)); }
    handle(await res.json());
  } catch (e) {
    setMsg('Chưa ghi nhận chấm công', String(e.message), '#eab308');
  } finally { busy = false; }
}
setInterval(scan, SCAN_MS);
</script>
</body>
</html>
